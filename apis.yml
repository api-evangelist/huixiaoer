name: Huixiaoer
description: 'Huixiaoer (会小二) is a Chinese online platform for booking meeting venues, hotel
  conference rooms, and event spaces, operated by Beijing Yundong Digital Media Technology (北京云动数字媒体技术有限公司).
  It connects companies with a network of conference hotels and specialty venues across China and 20+
  overseas cities, offering venue matching, price negotiation, and one-on-one meeting-planning advisors,
  plus bundled catering, accommodation, transportation, staging, team-building, incentive travel, and
  exhibition booth services on a free-to-client, commission-based model. Backed by DCM Ventures and added
  to the API Evangelist network as a portfolio lead; no public developer program, API, or documentation
  surface was found during enrichment.'
